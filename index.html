<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>G&T S.R.L. | Producto</title>


  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f3f3;
      color: #171717;
      min-height: 100vh;
    }


    /* =========================
       ENCABEZADO
    ========================= */

    .header {
      background: #ffffff;
      text-align: center;
      padding: 18px 18px 15px;
      border-bottom: 1px solid #dddddd;
    }


    .logo {
      width: 210px;
      max-width: 75%;
      height: auto;
      display: block;
      margin: 0 auto 8px;
    }


    .header-text {
      font-size: 13px;
      color: #666666;
      letter-spacing: 0.4px;
    }


    /* =========================
       CONTENEDOR
    ========================= */

    .container {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      padding: 20px 16px 35px;
    }


    /* =========================
       TARJETA PRODUCTO
    ========================= */

    .card {
      background: #ffffff;
      border-radius: 18px;
      padding: 25px 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }


    .category {
      font-size: 12px;
      color: #777777;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }


    .product-name {
      font-size: 31px;
      font-weight: 800;
      line-height: 1.05;
      margin-bottom: 7px;
      color: #111111;
    }


    .measure {
      font-size: 19px;
      color: #444444;
      margin-bottom: 18px;
    }


    .color {
      background: #f1f1f1;
      border-radius: 9px;
      padding: 11px 13px;
      font-size: 15px;
      margin-bottom: 23px;
    }


    .color strong {
      font-weight: 700;
    }


    /* =========================
       PRECIOS / OFERTA
    ========================= */

    .prices {
      margin-top: 5px;
    }

    .offer {
      border: 2px solid #c00000;
      border-radius: 14px;
      overflow: hidden;
      background: #fff8f8;
    }

    .offer-title {
      background: #c00000;
      color: #ffffff;
      padding: 10px 12px;
      font-size: 16px;
      font-weight: 800;
      text-align: center;
      letter-spacing: 0.5px;
    }

    .offer-content {
      padding: 14px 12px 16px;
      text-align: center;
    }

    .offer-price {
      font-size: 30px;
      font-weight: 900;
      color: #c00000;
      line-height: 1.1;
    }

    .offer-unit {
      font-size: 13px;
      color: #666666;
      margin-top: 3px;
    }

    .offer-normal {
      margin-top: 9px;
      font-size: 13px;
      color: #777777;
    }

    .offer-normal strong {
      color: #444444;
    }

    .offer-box {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #e3caca;
      font-size: 18px;
      font-weight: 800;
      color: #333333;
    }

    .offer-box strong {
      color: #c00000;
    }

    /* =========================
       INFORMACIÓN
    ========================= */

    .section-title {
      margin-top: 27px;
      padding-top: 20px;
      border-top: 1px solid #eeeeee;

      font-size: 13px;
      font-weight: 700;
      color: #555555;

      text-transform: uppercase;
      letter-spacing: 1px;
    }


    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 11px;
      margin-top: 13px;
    }


    .info {
      background: #f6f6f6;
      border-radius: 11px;
      padding: 13px 12px;
    }


    .info-title {
      font-size: 12px;
      color: #777777;
      margin-bottom: 5px;
      line-height: 1.2;
    }


    .info-value {
      font-size: 16px;
      font-weight: 700;
      color: #171717;
    }


    /* =========================
       WHATSAPP
       OCULTO POR AHORA
    ========================= */

    .contact {
      display: none;

      margin-top: 18px;
      background: #eaf7ef;
      border-radius: 15px;
      padding: 19px 16px;
      text-align: center;
    }


    .contact-title {
      color: #168447;
      font-size: 17px;
      font-weight: 800;
      margin-bottom: 7px;
    }


    .contact-text {
      color: #4d5a52;
      font-size: 13px;
      line-height: 1.45;
      margin-bottom: 14px;
    }


    .whatsapp-button {
      display: inline-block;
      background: #159447;
      color: #ffffff;
      text-decoration: none;

      padding: 12px 20px;

      border-radius: 9px;

      font-size: 15px;
      font-weight: 700;

      box-shadow: 0 3px 8px rgba(0,0,0,0.12);
    }


    .whatsapp-button:hover {
      opacity: 0.92;
    }


    /* =========================
       MENSAJE FINAL
    ========================= */

    .message {
      margin-top: 16px;
      background: #ffffff;
      border-radius: 15px;
      padding: 18px 16px;
      text-align: center;
      border: 1px solid #eeeeee;
    }


    .message-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 7px;
    }


    .message-text {
      font-size: 13px;
      color: #666666;
      line-height: 1.5;
    }


    /* =========================
       PIE
    ========================= */

    .footer {
      text-align: center;
      padding: 18px 10px 5px;
      color: #888888;
      font-size: 11px;
      line-height: 1.5;
    }


    /* =========================
       CARGANDO
    ========================= */

    .loading {
      text-align: center;
      padding: 55px 20px;
      color: #777777;
      font-size: 14px;
    }

    .loading-dots {
  display: inline-flex;
  margin-left: 2px;
}

.loading-dots span {
  opacity: 0.2;
  animation: loadingDot 1.4s infinite;
}

.loading-dots span:nth-child(1) {
  animation-delay: 0s;
}

.loading-dots span:nth-child(2) {
  animation-delay: 0.2s;
}

.loading-dots span:nth-child(3) {
  animation-delay: 0.4s;
}

@keyframes loadingDot {
  0%, 60%, 100% {
    opacity: 0.2;
  }

  30% {
    opacity: 1;
  }
}


    /* =========================
       ERROR
    ========================= */

    .error {
      background: #ffffff;
      border-radius: 16px;
      padding: 30px 20px;
      text-align: center;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    }


    .error h2 {
      margin-bottom: 10px;
    }


    .error p {
      color: #666666;
      font-size: 14px;
    }


    /* =========================
       CELULARES PEQUEÑOS
    ========================= */

    @media (max-width: 380px) {

      .product-name {
        font-size: 27px;
      }


      .measure {
        font-size: 17px;
      }


      .price {
        font-size: 20px;
      }


      .prices {
        width: 100%;
      }

      .offer-price {
        font-size: 27px;
      }

      .offer-box {
        font-size: 17px;
      }

    }

  </style>

</head>


<body>


  <!-- =========================
       ENCABEZADO G&T
  ========================= -->

  <header class="header">

    <img
      src="logo.png"
      alt="G&T S.R.L. - Materiales de Construcción"
      class="logo"
    >

    <div class="header-text">
      Información del producto
    </div>

  </header>


  <main class="container">


    <!-- CARGANDO -->

<div id="loading" class="loading">
  <span>Consultando información del producto</span>
  <span class="loading-dots">
    <span>.</span>
    <span>.</span>
    <span>.</span>
  </span>
</div>


    <!-- PRODUCTO -->

    <div id="product" style="display:none;"></div>


    <!-- ERROR -->

    <div id="error" style="display:none;"></div>


  </main>


  <script>


    /* =========================
       API GOOGLE APPS SCRIPT
    ========================= */

    const API_URL =
      "https://script.google.com/macros/s/AKfycbzhfaLJ2F-Rs0e50nMBNCYIToZ-RysALfsDVy4CamKoNRE_OBL1b18QLsFsYA50pJr5kQ/exec";


    /* =========================
       OBTENER ID DEL QR
    ========================= */

    const parametros =
      new URLSearchParams(window.location.search);


    const id =
      parametros.get("id");


    /* =========================
       FORMATO ARGENTINO
    ========================= */

    function formatoNumero(valor, decimales = 2) {

      return new Intl.NumberFormat("es-AR", {

        minimumFractionDigits: decimales,

        maximumFractionDigits: decimales

      }).format(Number(valor));

    }


    function formatoPrecio(valor) {

      return formatoNumero(valor, 2);

    }


    /* =========================
       CARGAR PRODUCTO
    ========================= */

    async function cargarProducto() {


      if (!id) {

        mostrarError(
          "No se indicó un producto."
        );

        return;

      }


      try {


        const respuesta = await fetch(

          API_URL +
          "?id=" +
          encodeURIComponent(id)

        );


        const datos =
          await respuesta.json();


        if (!datos.ok) {

          mostrarError(
            "No encontramos este producto."
          );

          return;

        }


        mostrarProducto(datos.producto);


      } catch (error) {


        console.error(error);


        mostrarError(
          "No pudimos consultar la información. Intente nuevamente."
        );

      }

    }


    /* =========================
       MOSTRAR PRODUCTO
    ========================= */

    function mostrarProducto(p) {


      document.getElementById("loading")
        .style.display = "none";


      /* =========================
         CÁLCULOS
      ========================= */

      const kgCaja =
        Number(p["Kg/Caja"]);


      const precioHabitual =
        Number(p["Precio Contado"]);


      const m2Caja =
        Number(p["Caja m²"]);


      const valorOferta =
        p["OFERTA"];


      const tieneOferta =
        valorOferta !== "" &&
        valorOferta !== null &&
        valorOferta !== undefined &&
        !isNaN(Number(valorOferta)) &&
        Number(valorOferta) > 0;


      const precioOferta =
        tieneOferta
          ? Number(valorOferta)
          : precioHabitual;


      const precioCaja =
        precioOferta * m2Caja;


      /* =========================
         MOSTRAR FICHA
      ========================= */

      const bloquePrecios =
        tieneOferta
          ? `
            <div class="prices">

              <div class="offer">

                <div class="offer-title">
                  🔥 OFERTA
                </div>

                <div class="offer-content">

                  <div class="offer-price">
                    $ ${formatoPrecio(precioOferta)}
                  </div>

                  <div class="offer-unit">
                    por m²
                  </div>

                  <div class="offer-normal">
                    Precio habitual:
                    <strong>
                      $ ${formatoPrecio(precioHabitual)} /m²
                    </strong>
                  </div>

                  <div class="offer-box">
                    Precio por caja:
                    <strong>
                      $ ${formatoPrecio(precioCaja)}
                    </strong>

                    <br>

                    <span class="offer-unit">
                      ${formatoNumero(m2Caja, 2)} m² por caja
                    </span>
                  </div>

                </div>

              </div>

            </div>
          `
          : `
            <div class="prices">

              <div class="offer" style="border: 1px solid #dddddd; background: #ffffff;">

                <div class="offer-title" style="background: #333333;">
                  Precio contado
                </div>

                <div class="offer-content">

                  <div class="offer-price" style="color: #111111;">
                    $ ${formatoPrecio(precioHabitual)}
                  </div>

                  <div class="offer-unit">
                    por m²
                  </div>

                  <div class="offer-box" style="border-top: 1px solid #eeeeee;">
                    Precio por caja:
                    <strong style="color: #111111;">
                      $ ${formatoPrecio(precioCaja)}
                    </strong>

                    <br>

                    <span class="offer-unit">
                      ${formatoNumero(m2Caja, 2)} m² por caja
                    </span>
                  </div>

                </div>

              </div>

            </div>
          `;


      /* =========================
         MOSTRAR FICHA
      ========================= */

      document.getElementById("product")
        .innerHTML = `


        <div class="card">


          <!-- PRODUCTO -->

          <div class="category">
            Cerámico
          </div>


          <div class="product-name">
            ${p["Producto"]}
          </div>


          <div class="measure">
            ${p["Medida"]} cm
          </div>


          <div class="color">
            <strong>Color:</strong>
            ${p["Color"]}
          </div>


          <!-- =====================
               PRECIOS / OFERTA
           ====================== -->

          ${bloquePrecios}


          <!-- =====================
               INFORMACIÓN
          ====================== -->

          <div class="section-title">
            Información de presentación
          </div>


          <div class="info-grid">


            <!-- CONTENIDO CAJA -->

            <div class="info">

              <div class="info-title">
                Contenido por caja
              </div>

              <div class="info-value">
                ${formatoNumero(m2Caja, 2)} m²
              </div>

            </div>


            <!-- PESO CAJA -->

            <div class="info">

              <div class="info-title">
                Peso por caja
              </div>

              <div class="info-value">
                ${formatoNumero(kgCaja, 2)} kg
              </div>

            </div>


            <!-- CAJAS PALLET -->

            <div class="info">

              <div class="info-title">
                Cajas por pallet
              </div>

              <div class="info-value">
                ${formatoNumero(p["Cj x pl"], 0)}
              </div>

            </div>


            <!-- PESO PALLET -->

            <div class="info">

              <div class="info-title">
                Peso del pallet
              </div>

              <div class="info-value">
                ${formatoNumero(p["Kg/Pallet"], 0)} kg
              </div>

            </div>


          </div>


          <!-- =====================
               WHATSAPP
               OCULTO
          ====================== -->

          <div class="contact">


            <div class="contact-title">
              ¿Necesitás consultar disponibilidad?
            </div>


            <div class="contact-text">

              Estamos para ayudarte.
              Comunicate con nosotros por WhatsApp
              y te asesoramos con gusto.

            </div>


          </div>


          <!-- =====================
               MENSAJE FINAL
          ====================== -->

          <div class="message">

            <div class="message-title">
              Gracias por confiar en nosotros.
            </div>


            <div class="message-text">

              En G&T S.R.L. te acompañamos
              en cada etapa de tu proyecto.
              <br>
              ¡Estamos a tu servicio!

            </div>

          </div>


        </div>


        <!-- PIE -->

        <div class="footer">

          G&T S.R.L. · Materiales de Construcción.

        </div>


      `;


      document.getElementById("product")
        .style.display = "block";

    }


    /* =========================
       ERROR
    ========================= */

    function mostrarError(mensaje) {


      document.getElementById("loading")
        .style.display = "none";


      document.getElementById("error")
        .innerHTML = `

        <div class="error">

          <h2>
            Producto no disponible
          </h2>

          <p>
            ${mensaje}
          </p>

        </div>

      `;


      document.getElementById("error")
        .style.display = "block";

    }


    /* =========================
       INICIAR
    ========================= */

    cargarProducto();


  </script>


</body>

</html>
